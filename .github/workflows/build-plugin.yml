name: Build md-design plugin

on:
  push:
    # Tag pushes only. Ordinary branch pushes never start this workflow.
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-plugin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PR package checks resolve an existing stable tag from Git history.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Resolve package version from Git tag
        id: version
        run: |
          version="$(python scripts/release_policy.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Package plugin with resolved version
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: npm run package:plugin -- --version "$PACKAGE_VERSION"
      - run: npm run check:plugin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: md-design-plugin
          path: |
            .build/*.zip
            .build/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Build summary
        run: |
          echo 'Plugin ZIP, local marketplace ZIP and SHA256SUMS are in md-design-plugin.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Package verified. Successful stable tag builds publish to ShadobaAI/md_design-mkt after all smoke jobs pass; PR builds never publish.' >> "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: build
    name: Extracted plugin (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: md-design-plugin
          path: .build/download
      - name: Verify checksums and extract into a path with spaces
        run: python scripts/verify-package.py .build/download "${{ runner.temp }}/md design smoke"
      - name: Check without npm dependencies or checkout-relative paths
        env:
          PLUGIN_ROOT: ${{ runner.temp }}/md design smoke/plugins/md-design
        run: node scripts/check-plugin.mjs "$env:PLUGIN_ROOT"
        shell: pwsh
      - run: node --test tests/server.test.mjs
        env:
          MD_DESIGN_DIST: ${{ runner.temp }}/md design smoke/plugins/md-design/dist
